name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Compile sources
        run: python3 -m compileall src
